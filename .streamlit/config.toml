# 일민미술관 전시 워크스페이스 — Streamlit 테마 설정
# GPT v4.1의 미술관 톤 팔레트를 기반으로 v5.1에서 통합

[theme]
# 메인 강조색 (액션 버튼, 링크) — 깊은 녹색
primaryColor = "#255c4a"

# 배경색 — 따뜻한 크림 (미술관 벽 느낌)
backgroundColor = "#f7f8f5"

# 사이드바도 메인과 동일 크림 톤 (배경 통일)
# 입력창은 별도 CSS로 화이트 분리하여 깨끗한 대비
secondaryBackgroundColor = "#f7f8f5"

# 본문 텍스트 — 근접 검정
textColor = "#20231f"

# 폰트 — 한국어 우선
font = "sans serif"

[server]
# 운영 시 자동 reload 비활성화 (개발 시 켜둠)
runOnSave = false
